<!DOCTYPE html>
<html lang="ru" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена — Великий гусь</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        .notfound {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 40px 20px;
            text-align: center;
        }
        .notfound__inner { max-width: 560px; display: grid; justify-items: center; gap: 8px; }
        .notfound__code {
            font-size: clamp(5rem, 18vw, 9rem);
            font-weight: 850;
            line-height: 1;
            letter-spacing: -0.06em;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .notfound__goose { animation: goose-bob 5s ease-in-out infinite; }
        .notfound__goose img { width: clamp(96px, 22vw, 132px); height: auto; filter: drop-shadow(0 18px 28px rgba(0, 0, 0, .45)); }
        .notfound h1 { font-size: clamp(1.5rem, 4vw, 2.2rem); margin: 4px 0 8px; }
        .notfound p { color: var(--muted); margin-bottom: 24px; }
        .notfound__actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    </style>
</head>
<body>
    <main class="notfound">
        <div class="notfound__inner">
            <div class="notfound__code">404</div>
            <div class="notfound__goose" aria-hidden="true">
                <img src="assets/img/favicon.svg" alt="" width="120" height="120">
            </div>
            <h1>Гусь эту страницу не нашёл</h1>
            <p>Похоже, ссылка устарела или в адресе опечатка. Зато главная на месте.</p>
            <div class="notfound__actions">
                <a class="btn btn--primary" href="./">На главную</a>
                <a class="btn btn--ghost" href="./#projects">Смотреть проекты</a>
            </div>
        </div>
    </main>
</body>
</html>
